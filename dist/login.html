<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đăng nhập vào GreenLedger Duyên Hải 1 để kiểm kê khí nhà kính.">
  <title>Đăng nhập · Duyên Hải 1 GreenLedger</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-card">
    <div class="identity">
      <p class="wordmark">GreenLedger</p>
      <img class="plant-photo" src="duyen-hai.png" width="281" height="180" alt="Toàn cảnh nhà máy nhiệt điện Duyên Hải nhìn từ trên cao">
      <div class="site-name">
        <p class="facility">Duyên Hải 1</p>
        <p class="purpose">Kiểm kê khí nhà kính</p>
      </div>
    </div>
    <section class="access" aria-labelledby="login-title">
      <div class="access-content">
        <h1 id="login-title">Đăng nhập</h1>
        <p class="description">Sử dụng tài khoản của ca vận hành để vào GreenLedger.</p>
        <form class="login-form" action="/login" method="post">
          <label for="username">Tài khoản</label>
          <input id="username" name="username" value="pxvh1" autocomplete="username" maxlength="64" required>
          <label for="password">Mật khẩu</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
          <!-- login-error -->
          <button type="submit" class="primary">Đăng nhập <span aria-hidden="true">→</span></button>
        </form>
        <!-- account-links -->
      </div>
    </section>
  </main>
</body>
</html>
